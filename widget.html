<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Claude 사용량</title>
<style>
:root {
  --bg: #16181d; --card: #1f2229; --card2: #262a33; --line: #2e333d;
  --fg: #e8eaed; --dim: #8d94a0; --faint: #5c6370;
  --ok: #4cc38a; --warn: #e5a83b; --bad: #f2555a; --accent: #6aa8ff; --accent2: #b892ff; --clay: #d9885f;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef0f3; --card: #ffffff; --card2: #f4f5f7; --line: #e1e4e8;
    --fg: #1f2328; --dim: #646c78; --faint: #9aa1ab;
    --ok: #1f9d63; --warn: #b7791f; --bad: #d1343a; --accent: #2e6ff2; --accent2: #7b4fd6; --clay: #c0643a;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef0f3; --card: #ffffff; --card2: #f4f5f7; --line: #e1e4e8;
  --fg: #1f2328; --dim: #646c78; --faint: #9aa1ab;
  --ok: #1f9d63; --warn: #b7791f; --bad: #d1343a; --accent: #2e6ff2; --accent2: #7b4fd6; --clay: #c0643a;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg);
  font: 13px/1.45 "Pretendard", "맑은 고딕", "Malgun Gothic", system-ui, sans-serif; }
body { padding: 12px; user-select: none; }
.num { font-variant-numeric: tabular-nums; }

/* 머리 */
header { display: flex; align-items: center; gap: 8px; margin: 2px 2px 12px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
.dot.warn { background: var(--warn); box-shadow: 0 0 0 4px color-mix(in srgb, var(--warn) 22%, transparent); }
.dot.bad { background: var(--bad); box-shadow: 0 0 0 4px color-mix(in srgb, var(--bad) 22%, transparent); }
.dot.busy { background: var(--accent); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .35; } }
header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: -.2px; }
header .sub { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .grow { flex: 1; min-width: 0; }
.icon-btn { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 8px;
  height: 30px; min-width: 30px; padding: 0 10px; cursor: pointer; font: inherit; font-size: 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none; }
.icon-btn.sq { padding: 0; width: 30px; }
.icon-btn:hover { background: var(--card2); }
.icon-btn.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.icon-btn:disabled { opacity: .55; cursor: default; }
.icon-btn svg { width: 15px; height: 15px; }
.spin svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 카드 */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 10px;
  margin-bottom: 10px; }
.card h2 { font-size: 11.5px; font-weight: 600; color: var(--dim); margin: 0 0 9px; display: flex;
  align-items: center; gap: 8px; letter-spacing: .2px; }
.card h2 .r { margin-left: auto; font-weight: 400; color: var(--faint); }
.card h2 a { color: var(--faint); text-decoration: none; cursor: pointer; font-weight: 400; }
.card h2 a:hover { color: var(--accent); }
.msg { color: var(--dim); font-size: 12px; padding: 4px 0; }
.msg.bad { color: var(--bad); }
.optin { font-size: 12px; color: var(--dim); }
.optin p { margin: 0 0 6px; }
.optin b { color: var(--fg); font-weight: 600; }
.optin ul { margin: 0 0 10px; padding-left: 18px; }
.optin li { margin: 2px 0; }

/* 지표 타일 */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--card2); border-radius: 9px; padding: 8px 10px 7px; min-width: 0; }
.tile .k { font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; gap: 6px; }
.tile .k span:first-child { white-space: nowrap; flex: none; }
.tile .k span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-size: 19px; font-weight: 700; letter-spacing: -.4px; margin-top: 1px; }
.tile .v small { font-size: 11px; font-weight: 500; color: var(--dim); margin-left: 3px; letter-spacing: 0; }
.tile .s { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 5px 0 4px; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); transition: width .4s; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 9px; color: var(--dim); font-size: 11.5px; }
.meta b { color: var(--fg); font-weight: 500; }
.warnline { margin-top: 8px; font-size: 11.5px; color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent);
  border-radius: 7px; padding: 5px 8px; }
.warnline.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
.warnline small { display: block; color: var(--dim); }

/* 모델별 주간 한도 · 막대 목록 */
.lrows { display: grid; grid-template-columns: minmax(0, 110px) 1fr 40px; gap: 5px 8px; align-items: center;
  font-size: 11.5px; margin-top: 9px; }
.lrows .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
.lrows .b { height: 7px; background: var(--card2); border-radius: 3px; overflow: hidden; }
.lrows .b i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.lrows .x { text-align: right; }
.hbars { display: grid; grid-template-columns: minmax(0, 118px) 1fr auto; gap: 4px 8px; align-items: center;
  font-size: 11.5px; }
.hbars .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
.hbars .b { height: 9px; background: var(--card2); border-radius: 3px; overflow: hidden; }
.hbars .b i { display: block; height: 100%; background: var(--accent2); border-radius: 3px; }
.hbars .x { text-align: right; white-space: nowrap; }
.hbars .x small { color: var(--faint); margin-left: 4px; }
.hbars .rest { color: var(--faint); }
.hbars .b i.rest { background: var(--faint); opacity: .5; }
.sec { display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; font-size: 11px; color: var(--dim); }
.sec .r { margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--dim); font: inherit; font-size: 11px; padding: 2px 9px; cursor: pointer; }
.seg button.on { background: var(--card2); color: var(--fg); }
.pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.pill { font-size: 11px; border-radius: 20px; padding: 2px 9px; background: var(--card2); color: var(--dim); }
.pill b { color: var(--fg); font-weight: 500; }

.chart { width: 100%; display: block; }
.chart text { font-size: 9.5px; fill: var(--faint); }
.chart text.today { fill: var(--fg); font-weight: 600; }
.chart text.val { fill: var(--dim); }

footer { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 11px; margin: 2px 2px 4px; }
footer select { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
  font: inherit; font-size: 11px; padding: 1px 4px; }
footer .grow { flex: 1; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--faint); }
</style>
</head>
<body>

<header>
  <div class="dot" id="dot"></div>
  <div class="grow">
    <h1>Claude 사용량</h1>
    <div class="sub num" id="sub">불러오는 중…</div>
  </div>
  <button class="icon-btn" id="refresh" title="플랜 한도와 토큰 기록 새로 가져오기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>새로고침</button>
  <button class="icon-btn sq" id="theme" title="테마: 자동">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
  <button class="icon-btn sq" id="pin" title="항상 위">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 6 4 4H6l4-4z"/></svg></button>
</header>

<section class="card" id="plan">
  <h2>플랜 한도 <span class="r" id="plan-r"></span><a id="plan-off" title="플랜 한도 가져오기를 끕니다" hidden>끄기</a><a id="open-web" title="claude.ai 사용량 페이지 열기">웹에서 보기</a></h2>
  <div id="plan-body"><div class="msg">처음 정보를 가져오는 중…</div></div>
  <div id="plan-err"></div>
</section>

<section class="card" id="tok">
  <h2>이 PC의 Claude Code 토큰 <span class="r num" id="tok-r"></span></h2>
  <div id="tok-body"><div class="msg">기록을 읽는 중… (처음에는 몇 초 걸립니다)</div></div>
</section>

<footer>
  <span>자동 새로고침</span>
  <select id="interval">
    <option value="60">1분</option><option value="120">2분</option><option value="300">5분</option>
    <option value="600">10분</option><option value="900">15분</option><option value="1800">30분</option>
  </select>
  <span class="grow"></span>
  <span title="공개 API 단가로 계산한 값입니다. 구독 요금과는 관계없습니다.">$ = API 환산 추정</span>
  <span class="num" id="ver" title="비공식 위젯 · Anthropic과 관계없음"></span>
</footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const THEMES = {auto: "자동", light: "라이트", dark: "다크"};
let conf = {}, plan = null, planErr = null, planOff = false, local = null;
let lastPlanHTML = "", lastPlanErrHTML = "", lastTokKey = "";
let inflight = null, timer = null;

/* 숫자 모양 */
function tok(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "K";
  return String(Math.round(n));
}
function usd(v) { return v >= 1000 ? "$" + Math.round(v).toLocaleString("en-US") : v >= 100 ? "$" + v.toFixed(0) : "$" + v.toFixed(2); }
function hhmm(ts) { return new Date(ts * 1000).toTimeString().slice(0, 5); }
function ago(ts) {
  const s = Date.now() / 1000 - ts;
  if (s < 60) return "방금"; if (s < 3600) return Math.floor(s / 60) + "분 전";
  return Math.floor(s / 3600) + "시간 전";
}
function left(ts) {   /* 초기화까지 남은 시간 */
  const s = ts - Date.now() / 1000;
  if (s <= 0) return "곧";
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}일 ${h}시간` : h ? `${h}시간 ${m}분` : `${Math.max(1, m)}분`;
}
function when(ts) {
  const d = new Date(ts * 1000), now = new Date();
  if (d.toDateString() === now.toDateString()) return hhmm(ts);
  return `${d.getMonth() + 1}/${d.getDate()}(${"일월화수목금토"[d.getDay()]}) ${hhmm(ts)}`;
}
/* severity(서버 판단) 우선, 없으면 퍼센트로 */
function sev(l) {
  const s = (l.severity || "").toLowerCase();
  if (/crit|exceed|block|limit|over|error|max/.test(s)) return "bad";
  if (s && s !== "normal" && s !== "ok") return "warn";
  if (!s) return l.percent >= 90 ? "bad" : l.percent >= 75 ? "warn" : "ok";
  return "ok";
}
const SEVC = {ok: "var(--accent)", warn: "var(--warn)", bad: "var(--bad)"};

/* ---------- 플랜 한도 ---------- */
function resetSpan(ts) { return ts ? `<span data-reset="${ts}">${left(ts)}</span>` : ""; }
function limitTile(l) {
  const c = SEVC[sev(l)], p = l.percent;
  return `<div class="tile"><div class="k"><span>${esc(l.name)}</span><span class="num" title="초기화 시각">${l.resets ? esc(when(l.resets)) : ""}</span></div>
    <div class="v num" style="${sev(l) !== "ok" ? "color:" + c : ""}">${Math.round(p)}<small>%</small></div>
    <div class="bar"><i style="width:${Math.min(100, Math.max(0, p))}%;background:${c}"></i></div>
    <div class="s num">${l.resets ? "초기화까지 " + resetSpan(l.resets) : "&nbsp;"}</div></div>`;
}
const OPTIN = `<div class="optin">
  <p>claude.ai 플랜 한도(5시간 세션·주간)를 보려면 이 PC에 저장된 Claude Code 로그인 토큰으로
    Anthropic의 <b>공개 문서에 없는 API</b>를 불러야 해서 기본으로 꺼 두었습니다.</p>
  <ul>
    <li>토큰은 요청할 때만 파일에서 읽어 api.anthropic.com으로 보내고, 어디에도 저장·기록하지 않습니다.</li>
    <li>공식 지원 기능이 아니라 예고 없이 막히거나 바뀔 수 있고, Anthropic 약관상 허용되는지 분명하지 않습니다. 직접 판단해서 켜 주세요.</li>
    <li>켜지 않아도 위의 [웹에서 보기]로 같은 숫자를 볼 수 있습니다.</li>
  </ul>
  <button class="icon-btn" data-act="plan-on">이해했고, 플랜 한도 켜기</button></div>`;
function renderPlan() {
  let html = "";
  if (planOff) {
    html = OPTIN;
  } else if (plan) {
    const L = plan.limits || [];
    const main = L.filter(l => !l.scoped).slice(0, 2), more = L.filter(l => !main.includes(l));
    html += `<div class="tiles">${main.map(limitTile).join("")}</div>`;
    if (more.length) html += `<div class="lrows num">${more.map(l => `<span class="n" title="${esc(l.name)}${l.resets ? " · 초기화 " + esc(when(l.resets)) : ""}">${esc(l.name)}</span>
      <span class="b"><i style="width:${Math.min(100, Math.max(0, l.percent))}%;background:${SEVC[sev(l)]}"></i></span>
      <span class="x">${Math.round(l.percent)}%</span>`).join("")}</div>`;
    const x = plan.extra;
    if (x) html += `<div class="meta num"><span>추가 사용량 <b>${x.currency === "USD" ? usd(x.used) : x.used.toFixed(2) + " " + esc(x.currency)}</b>${x.limit != null ? ` / ${x.currency === "USD" ? usd(x.limit) : x.limit + " " + esc(x.currency)}` : ""}${x.percent != null ? ` (${Math.round(x.percent)}%)` : ""}</span></div>`;
    const bd = (plan.breakdown || []).filter(b => b.percent > 0);
    if (bd.length) html += `<div class="pills num"><span class="pill">주간 사용 비중</span>${bd.map(b => `<span class="pill">${esc(b.name)} <b>${Math.round(b.percent)}%</b></span>`).join("")}</div>`;
  } else if (planErr) {
    html = `<div class="msg">한도 정보를 아직 가져오지 못했습니다</div>`;
  } else {
    html = `<div class="msg">처음 정보를 가져오는 중…</div>`;
  }
  if (html !== lastPlanHTML) { $("#plan-body").innerHTML = html; lastPlanHTML = html; }
  let err = "";
  if (planErr) err = `<div class="warnline${planErr.kind === "auth" ? "" : " bad"}">${esc(planErr.error)}${planErr.detail ? ` <small>${esc(planErr.detail)}</small>` : ""}${plan ? `<small>아래는 ${esc(hhmm(plan.fetched))}에 가져온 값입니다</small>` : ""}</div>`;
  if (err !== lastPlanErrHTML) { $("#plan-err").innerHTML = err; lastPlanErrHTML = err; }
  $("#plan-r").textContent = (plan || planErr)?.plan || "";
  $("#plan-off").hidden = !conf.plan_enabled;
}
async function setPlanEnabled(on) {
  conf.plan_enabled = on;
  await pywebview.api.set_conf("plan_enabled", on);
  if (inflight) await inflight;   /* 켜기 전에 시작한 요청 결과가 덮어쓰지 않도록 */
  plan = null; planErr = null; planOff = !on;
  renderPlan(); renderHead();
  if (on) refresh();
}

/* ---------- 이 PC의 토큰 ---------- */
function dayChart(days) {
  const W = 380, H = 92, padB = 15, padT = 13, max = Math.max(1, ...days.map(d => d.total));
  const step = (W - 8) / days.length, bw = Math.min(30, step - 10);
  let g = "";
  days.forEach((d, i) => {
    const today = i === days.length - 1;
    const h = d.total ? Math.max(2, d.total / max * (H - padB - padT)) : 0, x = 4 + i * step + (step - bw) / 2, y = H - padB - h;
    g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${today ? "var(--clay)" : "var(--accent)"}" opacity="${today ? 1 : .75}"><title>${d.label}(${d.wd}) · ${tok(d.total)} 토큰 · 출력 ${tok(d.out)} · ${usd(d.cost)}</title></rect>`;
    if (d.total) g += `<text class="val" x="${(x + bw / 2).toFixed(1)}" y="${(y - 3).toFixed(1)}" text-anchor="middle">${tok(d.total)}</text>`;
    g += `<text class="${today ? "today" : ""}" x="${(x + bw / 2).toFixed(1)}" y="${H - 2}" text-anchor="middle">${today ? "오늘" : d.label + " " + d.wd}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function hbars(rows, color) {
  if (!rows.length) return `<div class="msg">기록 없음</div>`;
  const max = Math.max(1, ...rows.filter(r => !r.rest).map(r => r.total));
  return `<div class="hbars num">${rows.map(r => `<span class="n${r.rest ? " rest" : ""}" title="${esc(r.label || r.name)}">${esc(r.label || r.name)}</span>
    <span class="b"><i class="${r.rest ? "rest" : ""}" style="width:${Math.min(100, r.total / max * 100).toFixed(1)}%${color && !r.rest ? ";background:" + color : ""}"></i></span>
    <span class="x">${tok(r.total)}<small>${usd(r.cost)}</small></span>`).join("")}</div>`;
}
function renderLocal() {
  if (!local) return;
  const range = conf.proj_range === "week" ? "week" : "today";
  const key = JSON.stringify([local.error, local.today, local.days, local.models, local.projects, local.unpriced, range]);
  if (key === lastTokKey) return;   /* 바뀐 게 없으면 다시 그리지 않음 */
  lastTokKey = key;
  if (local.error) { $("#tok-body").innerHTML = `<div class="msg bad">${esc(local.error)}</div>`; return; }
  const t = local.today, week = local.days.reduce((a, d) => ({total: a.total + d.total, cost: a.cost + d.cost}), {total: 0, cost: 0});
  let html = `<div class="tiles">
    <div class="tile"><div class="k"><span>오늘 토큰</span><span class="num">출력 ${tok(t.out)}</span></div>
      <div class="v num">${tok(t.total)}</div><div class="s num">7일 ${tok(week.total)}</div></div>
    <div class="tile"><div class="k"><span>오늘 API 환산</span><span>추정</span></div>
      <div class="v num">${usd(t.cost)}</div><div class="s num">7일 ${usd(week.cost)}</div></div>
  </div>
  <div class="meta num"><span>입력 <b>${tok(t.in)}</b></span><span>출력 <b>${tok(t.out)}</b></span>
    <span>캐시 쓰기 <b>${tok(t.cw)}</b></span><span>캐시 읽기 <b>${tok(t.cr)}</b></span></div>
  <div class="sec">최근 7일</div>${dayChart(local.days)}
  <div class="sec">모델별 <span class="r">7일</span></div>${hbars(local.models, "var(--clay)")}
  <div class="sec">프로젝트별 <span class="r seg" id="seg">
    <button data-v="today" class="${range === "today" ? "on" : ""}">오늘</button><button data-v="week" class="${range === "week" ? "on" : ""}">7일</button></span></div>
  ${hbars(local.projects[range] || [])}`;
  if (local.unpriced?.length) html += `<div class="warnline">단가를 모르는 모델은 환산에서 뺐습니다: ${local.unpriced.map(esc).join(", ")}</div>`;
  $("#tok-body").innerHTML = html;
  $("#seg").querySelectorAll("button").forEach(b => b.onclick = () => {
    conf.proj_range = b.dataset.v; pywebview.api.set_conf("proj_range", conf.proj_range); renderLocal();
  });
}

/* ---------- 머리 · 시간 표시 ---------- */
function renderHead() {
  const busy = !!inflight;
  const localOk = local && !local.error;
  $("#dot").className = "dot " + (busy ? "busy" : planOff ? (localOk ? "ok" : "") :
    planErr ? (planErr.kind === "auth" ? "warn" : "bad") : plan ? "ok" : "");
  let s = busy ? "가져오는 중…" : "";
  if (!busy && planOff) {
    if (localOk) s = `토큰 기록 ${hhmm(local.scanned)}에 확인 · 플랜 한도 꺼짐`;
  } else if (!busy) {
    const at = planErr?.fetched || plan?.fetched;
    if (planErr) s = `확인 실패${at ? " · " + hhmm(at) : ""}`;
    else if (plan) s = `${hhmm(plan.fetched)}에 확인 (${ago(plan.fetched)}) · ${Math.round(conf.interval / 60)}분마다`;
  }
  $("#sub").textContent = s;
  $("#tok-r").textContent = local && !local.error ? `파일 ${local.files}개 · ${hhmm(local.scanned)}` : "";
}
function tickClock() {   /* 남은 시간 글자만 바꾼다 (innerHTML 다시 그리지 않음) */
  document.querySelectorAll("[data-reset]").forEach(e => { const v = left(+e.dataset.reset); if (e.textContent !== v) e.textContent = v; });
  renderHead();
}

/* ---------- 가져오기 ---------- */
function refresh() {
  if (inflight) return inflight;   /* 가져오는 중에 또 누르면 같은 작업을 기다린다 */
  const btn = $("#refresh");
  btn.classList.add("spin"); btn.disabled = true;
  inflight = (async () => {
    try {
      const [p, l] = await Promise.all([pywebview.api.plan(), pywebview.api.local()]);
      if (p && p.ok) { plan = p; planErr = null; planOff = false; }
      else if (p && p.kind === "disabled") { plan = null; planErr = null; planOff = true; }
      else { planErr = p || {kind: "internal", error: "응답 없음"}; planOff = false; }
      if (l) local = l;
    } catch (e) {
      planErr = {kind: "internal", error: "위젯 내부 오류", detail: String(e).slice(0, 120)};
    } finally {   /* 어떤 경우에도 버튼·표시를 원래대로 */
      inflight = null;
      btn.classList.remove("spin"); btn.disabled = false;
      try { renderPlan(); renderLocal(); } catch (e) { }
      renderHead();
    }
  })();
  renderHead();
  return inflight;
}
async function tickLocal() {
  if (inflight) return;
  try { const l = await pywebview.api.local(); if (l) { local = l; renderLocal(); } } catch (e) { }
  renderHead();
}
function schedule() {
  clearInterval(timer);
  timer = setInterval(refresh, Math.max(60, conf.interval || 300) * 1000);
}
function applyTheme() {
  if (conf.theme === "light" || conf.theme === "dark") document.documentElement.dataset.theme = conf.theme;
  else delete document.documentElement.dataset.theme;
  $("#theme").title = "테마: " + (THEMES[conf.theme] || "자동");
}

window.addEventListener("pywebviewready", async () => {
  conf = await pywebview.api.get_conf();
  applyTheme();
  $("#pin").classList.toggle("on", !!conf.topmost);
  const sel = $("#interval");
  if (![...sel.options].some(o => +o.value === conf.interval)) sel.add(new Option(Math.round(conf.interval / 60) + "분", conf.interval));
  sel.value = String(conf.interval);
  sel.onchange = async () => { conf.interval = +sel.value; await pywebview.api.set_conf("interval", conf.interval); schedule(); renderHead(); };
  $("#refresh").onclick = () => refresh();
  $("#pin").onclick = () => { conf.topmost = !conf.topmost; $("#pin").classList.toggle("on", conf.topmost); pywebview.api.set_conf("topmost", conf.topmost); };
  $("#theme").onclick = () => { const k = Object.keys(THEMES); conf.theme = k[(k.indexOf(conf.theme) + 1) % k.length]; applyTheme(); pywebview.api.set_conf("theme", conf.theme); };
  $("#open-web").onclick = () => pywebview.api.open_usage_page();
  $("#plan-off").onclick = () => setPlanEnabled(false);
  $("#plan-body").addEventListener("click", e => { if (e.target.closest("[data-act=plan-on]")) setPlanEnabled(true); });
  $("#ver").textContent = conf.version ? "v" + conf.version : "";
  refresh();
  schedule();
  setInterval(tickLocal, 30000);
  setInterval(tickClock, 20000);
});
</script>
</body>
</html>
