<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Claude Usage</title>
<style>
:root {
  --bg: #16181d; --card: #1f2229; --card2: #262a33; --line: #2e333d;
  --fg: #e8eaed; --dim: #8d94a0; --faint: #5c6370;
  --ok: #4cc38a; --warn: #e5a83b; --bad: #f2555a; --accent: #6aa8ff; --accent2: #b892ff; --clay: #d9885f;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef0f3; --card: #ffffff; --card2: #f4f5f7; --line: #e1e4e8;
    --fg: #1f2328; --dim: #646c78; --faint: #9aa1ab;
    --ok: #1f9d63; --warn: #b7791f; --bad: #d1343a; --accent: #2e6ff2; --accent2: #7b4fd6; --clay: #c0643a;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef0f3; --card: #ffffff; --card2: #f4f5f7; --line: #e1e4e8;
  --fg: #1f2328; --dim: #646c78; --faint: #9aa1ab;
  --ok: #1f9d63; --warn: #b7791f; --bad: #d1343a; --accent: #2e6ff2; --accent2: #7b4fd6; --clay: #c0643a;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg);
  font: 13px/1.45 "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "맑은 고딕", "Malgun Gothic",
  "Segoe UI", system-ui, sans-serif; }
body { padding: 12px; user-select: none; }
/* 영어 화면은 Segoe UI·SF 먼저 (맑은 고딕은 \ 를 ₩ 로 그린다) */
html[lang="en"], html[lang="en"] body { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, "Malgun Gothic", sans-serif; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* 머리 */
header { display: flex; align-items: center; gap: 6px; margin: 2px 2px 12px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); flex: none; margin-right: 2px; }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
.dot.warn { background: var(--warn); box-shadow: 0 0 0 4px color-mix(in srgb, var(--warn) 22%, transparent); }
.dot.bad { background: var(--bad); box-shadow: 0 0 0 4px color-mix(in srgb, var(--bad) 22%, transparent); }
.dot.busy { background: var(--accent); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .35; } }
header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; }
header .sub { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .grow { flex: 1; min-width: 0; }
.icon-btn { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 8px;
  height: 30px; min-width: 30px; padding: 0 10px; cursor: pointer; font: inherit; font-size: 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none; }
.icon-btn.sq { padding: 0; width: 30px; }
.icon-btn:hover { background: var(--card2); }
.icon-btn.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.icon-btn:disabled { opacity: .55; cursor: default; }
.icon-btn svg { width: 15px; height: 15px; }
.spin svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 카드 */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 10px;
  margin-bottom: 10px; }
.card h2 { font-size: 11.5px; font-weight: 600; color: var(--dim); margin: 0 0 9px; display: flex;
  align-items: center; gap: 8px; letter-spacing: .2px; }
.card h2 .r { margin-left: auto; font-weight: 400; color: var(--faint); }
.card h2 a, a.link { color: var(--faint); text-decoration: none; cursor: pointer; font-weight: 400; }
.card h2 a:hover, a.link:hover { color: var(--accent); }
.msg { color: var(--dim); font-size: 12px; padding: 4px 0; }
.msg.bad { color: var(--bad); }
.msg b { color: var(--fg); font-weight: 600; display: block; margin-bottom: 2px; }
.optin { font-size: 12px; color: var(--dim); margin-top: 8px; }
.optin p { margin: 0 0 6px; }
.optin b { color: var(--fg); font-weight: 600; }
.optin ul { margin: 0 0 10px; padding-left: 18px; }
.optin li { margin: 2px 0; }
.mini { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--dim); }
.mini span { flex: 1; min-width: 0; }

/* 설정 */
#settings h2 { margin-bottom: 6px; }
.rows { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; align-items: center; font-size: 12px; }
.rows > label:nth-child(odd), .rows > span:nth-child(odd) { color: var(--dim); white-space: nowrap; }
.rows select, .rows input[type=text] { background: var(--card2); color: var(--fg); border: 1px solid var(--line);
  border-radius: 6px; font: inherit; font-size: 12px; padding: 3px 6px; min-width: 0; }
.rows input[type=text] { width: 84px; text-align: right; user-select: text; }
.rows input[type=text]:focus, .rows select:focus { outline: none; border-color: var(--accent); }
.rows input.bad { border-color: var(--bad); }
.rows input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; justify-self: start; }
.rows .rate { display: flex; align-items: center; gap: 6px; }
.note { font-size: 11px; color: var(--faint); margin-top: 8px; }
.note.bad { color: var(--bad); }

/* 지표 타일 */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--card2); border-radius: 9px; padding: 8px 10px 7px; min-width: 0; }
.tile .k { font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; gap: 6px; }
.tile .k span:first-child { white-space: nowrap; flex: none; }
.tile .k span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-size: 19px; font-weight: 700; letter-spacing: -.4px; margin-top: 1px; }
.tile .v small { font-size: 11px; font-weight: 500; color: var(--dim); margin-left: 3px; letter-spacing: 0; }
.tile .cost { font-size: 13px; font-weight: 600; margin-top: 2px; }
.tile .fx { font-size: 12px; color: var(--dim); }
.tile .s { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.stale .v, .lrows .stale { color: var(--faint); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.stats > div { background: var(--card2); border-radius: 8px; padding: 6px 8px; min-width: 0; font-size: 11px; }
.stats span { display: block; color: var(--dim); }
.stats b { display: block; font-size: 14px; font-weight: 700; letter-spacing: -.3px; }
.stats b small { font-size: 10.5px; font-weight: 500; color: var(--dim); }
.stats i { display: block; font-style: normal; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 5px 0 4px; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); transition: width .4s; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 9px; color: var(--dim); font-size: 11.5px; }
.meta b { color: var(--fg); font-weight: 500; }
.warnline { margin-top: 8px; font-size: 11.5px; color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent);
  border-radius: 7px; padding: 5px 8px; }
.warnline.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
.warnline small { display: block; color: var(--dim); }

/* 모델별 주간 한도 · 막대 목록 */
.lrows { display: grid; grid-template-columns: minmax(0, 110px) 1fr 40px; gap: 5px 8px; align-items: center;
  font-size: 11.5px; margin-top: 9px; }
.lrows .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
.lrows .b { height: 7px; background: var(--card2); border-radius: 3px; overflow: hidden; }
.lrows .b i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.lrows .x { text-align: right; }
.hbars { display: grid; grid-template-columns: minmax(0, 118px) 1fr auto; gap: 4px 8px; align-items: center;
  font-size: 11.5px; }
.hbars .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
.hbars .b { height: 9px; background: var(--card2); border-radius: 3px; overflow: hidden; }
.hbars .b i { display: block; height: 100%; background: var(--accent2); border-radius: 3px; }
.hbars .x { text-align: right; white-space: nowrap; }
.hbars .x small { color: var(--faint); margin-left: 4px; }
.hbars .rest { color: var(--faint); }
.hbars .b i.rest { background: var(--faint); opacity: .5; }
.sec { display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; font-size: 11px; color: var(--dim); }
.sec .r { margin-left: auto; }
.sec.fold { cursor: pointer; border-radius: 6px; margin-left: -4px; margin-right: -4px; padding: 2px 4px; }
.sec.fold:hover { background: var(--card2); color: var(--fg); }
.sec.fold:focus-visible { outline: 1px solid var(--accent); }
.sec .chev { width: 10px; height: 10px; flex: none; transition: transform .15s; }
.sec.fold.closed .chev { transform: rotate(-90deg); }
.sec .sum { color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sec .sum b { color: var(--dim); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex: none; }
.seg button { border: 0; background: transparent; color: var(--dim); font: inherit; font-size: 11px; padding: 2px 9px; cursor: pointer; }
.seg button.on { background: var(--card2); color: var(--fg); }
.pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.pill { font-size: 11px; border-radius: 20px; padding: 2px 9px; background: var(--card2); color: var(--dim); }
.pill b { color: var(--fg); font-weight: 500; }

.chart { width: 100%; display: block; }
.chart text { font-size: 9.5px; fill: var(--faint); }
.chart text.today { fill: var(--fg); font-weight: 600; }
.chart text.val { fill: var(--dim); }
.chart text.tk { fill: var(--fg); font-weight: 600; }

footer { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 11px; margin: 2px 2px 4px; }
footer .grow { flex: 1; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--faint); }
</style>
</head>
<body>

<header>
  <div class="dot" id="dot"></div>
  <div class="grow">
    <h1 id="title">Claude</h1>
    <div class="sub num" id="sub">…</div>
  </div>
  <button class="icon-btn" id="refresh">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg><span id="refresh-t"></span></button>
  <button class="icon-btn sq" id="theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
  <button class="icon-btn sq" id="pin">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 6 4 4H6l4-4z"/></svg></button>
  <button class="icon-btn sq" id="gear">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<section class="card" id="settings" hidden>
  <h2><span id="set-t"></span><a class="r" id="set-close"></a></h2>
  <div class="rows">
    <label for="s-lang" id="l-lang"></label><select id="s-lang"></select>
    <label for="s-cur" id="l-cur"></label><select id="s-cur"></select>
    <label for="s-rate" id="l-rate"></label>
    <span class="rate num">$1 = <input id="s-rate" type="text" inputmode="decimal" maxlength="12" spellcheck="false"><span id="s-rate-c"></span></span>
    <label for="interval" id="l-int"></label><select id="interval"></select>
    <label for="s-auto" id="l-auto"></label><input id="s-auto" type="checkbox">
    <label for="s-plan" id="l-plan"></label><input id="s-plan" type="checkbox">
  </div>
  <div class="note" id="set-note"></div>
</section>

<section class="card" id="plan">
  <h2><span id="plan-t"></span> <span class="r" id="plan-r"></span><a id="plan-off" hidden></a><a id="open-web"></a></h2>
  <div id="plan-body"></div>
  <div id="plan-err"></div>
</section>

<section class="card" id="tok">
  <h2><span id="tok-t"></span> <span class="r num" id="tok-r"></span></h2>
  <div id="tok-body"></div>
</section>

<footer>
  <span id="est"></span>
  <a class="link num" id="fx-link"></a>
  <span class="grow"></span>
  <span class="num" id="ver"></span>
</footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

/* ---------- 화면 글자 (한국어 · 영어) ---------- */
const I18N = {
  ko: {
    title: "Claude 사용량", refresh: "새로고침", refreshTip: "플랜 한도와 토큰 기록 새로 가져오기",
    theme: "테마", themes: {auto: "자동", light: "라이트", dark: "다크"}, pin: "항상 위", settings: "설정", close: "닫기",
    planTitle: "플랜 한도", planOff: "끄기", planOffTip: "플랜 한도 가져오기를 끕니다", web: "웹에서 보기", webTip: "claude.ai 사용량 페이지 열기",
    loading: "처음 정보를 가져오는 중…", planFail: "한도 정보를 아직 가져오지 못했습니다", fetchedAt: t => `아래는 ${t}에 가져온 값입니다`,
    offLine: "플랜 한도(5시간 세션·주간)는 꺼져 있습니다", more: "켜는 방법", less: "접기",
    optin: `<p>claude.ai 플랜 한도(5시간 세션·주간)를 보려면 이 PC에 저장된 Claude Code 로그인 토큰으로
      Anthropic의 <b>공개 문서에 없는 API</b>를 불러야 해서 기본으로 꺼 두었습니다.</p>
      <ul><li>토큰은 요청할 때만 파일에서 읽어 api.anthropic.com으로 보내고, 어디에도 저장·기록하지 않습니다.</li>
      <li>공식 지원 기능이 아니라 예고 없이 막히거나 바뀔 수 있고, Anthropic 약관상 허용되는지 분명하지 않습니다. 직접 판단해서 켜 주세요.</li>
      <li>켜지 않아도 위의 [웹에서 보기]로 같은 숫자를 볼 수 있습니다.</li></ul>`,
    optinBtn: "이해했고, 플랜 한도 켜기",
    extra: "추가 사용량", breakdown: "주간 사용 비중", session: "5시간 세션", weekly: "주간 한도", weeklyOf: m => `주간 · ${m}`,
    limit: "한도", bd: {claude_code: "Claude Code", chat: "채팅", cowork: "Cowork", other: "기타"},
    resetAt: "초기화 시각", resetIn: "초기화까지 ", soon: "곧",
    resetDone: "초기화됨", resetChecking: "새 값을 가져오는 중…", resetBlocked: "새 값을 아직 가져오지 못했습니다",
    staleTip: "초기화 시각이 지나 예전 값은 더 이상 맞지 않습니다",
    err: {no_login: "Claude Code 로그인 정보가 없습니다. Claude Code에서 로그인하세요",
      cred_read: "로그인 정보 파일을 읽지 못했습니다",
      keychain: "키체인에서 Claude Code 로그인 정보를 읽지 못했습니다. macOS가 접근을 물으면 암호를 넣고 [항상 허용]을 누르세요",
      relogin: "Claude Code를 한 번 실행하면 토큰이 갱신됩니다",
      expired: "토큰이 만료되었습니다. Claude Code를 한 번 실행하면 토큰이 갱신되고 위젯에도 곧 반영됩니다",
      rate_limited: "요청이 너무 잦아 잠시 막혔습니다 (HTTP 429). 잠시 뒤 다시 시도하세요",
      http: s => `서버가 오류로 응답했습니다 (HTTP ${s})`, network: "네트워크에 연결하지 못했습니다",
      bad_json: "응답을 해석하지 못했습니다", format: "응답 형식이 바뀐 것 같습니다 (위젯 업데이트 필요)",
      internal: "내부 오류", widget: "위젯 내부 오류", none: "응답 없음"},
    net: {dns: "주소를 찾지 못했습니다. 인터넷 연결을 확인하세요", timeout: "응답 시간이 초과되었습니다", refused: "연결이 거부되었거나 끊겼습니다"},
    tokTitle: "이 PC의 Claude Code 토큰", reading: "기록을 읽는 중… (처음에는 몇 초 걸립니다)",
    scanErr: d => `기록을 읽지 못했습니다 (${d})`, files: (n, t) => `파일 ${n}개 · ${t}`,
    today: "오늘", tokens: "토큰", out: "출력", todayIn: "오늘 입력", cw: "캐시 쓰기", cr: "캐시 읽기", est: "API 환산 추정",
    periods: {"7": "7일", "30": "30일", month: "이번 달"}, last: p => `최근 ${p}`, thisMonth: m => `이번 달 (${m + 1}월)`,
    daily: "일별", avg: "일 평균", peak: "가장 많은 날", used: "사용한 날", ofDays: n => `/${n}일`,
    models: "모델별", projects: "프로젝트별", none: "기록 없음", others: n => `그 밖의 ${n}개`, andMore: n => ` 외 ${n}개`,
    fold: "접기", unfold: "펼치기", unpriced: "단가를 모르는 모델은 환산에서 뺐습니다: ",
    wdMon: "월화수목금토일".split(""), wdSun: "일월화수목금토".split(""),

    } else if ((days.length - 1 - i) % 7 === 0 || (i === 0 && (days.length - 1) % 7 >= 3)) {   /* 첫날도 (옆 글자와 겹치지 않으면) */
      /* 막대가 좁아 글자가 양 끝에서 잘리지 않게 첫날은 왼쪽, 오늘은 오른쪽에 맞춘다 */
      const [ax, anchor] = today ? [x + bw, "end"] : i === 0 ? [x, "start"] : [+cx, "middle"];
      g += `<text class="${today ? "today" : ""}" x="${ax.toFixed(1)}" y="${base}" text-anchor="${anchor}">${day}</text>`;
    }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
/* 기간 합계 · 일 평균 · 가장 많이 쓴 날 */
function sumDays(days) {
  return days.reduce((a, d) => ({total: a.total + d.total, cost: a.cost + d.cost, in: a.in + d.in, out: a.out + d.out,
    cw: a.cw + d.cw, cr: a.cr + d.cr, used: a.used + (d.total > 0 ? 1 : 0)}), {total: 0, cost: 0, in: 0, out: 0, cw: 0, cr: 0, used: 0});
}
function periodDays(p) {
  const n = p === "month" ? +local.today.date.slice(8, 10) : +p;
  return local.days.slice(-n);
}
function periodStats(days, s) {
  const t = T(), peak = days.reduce((a, d) => d.total > (a?.total || 0) ? d : a, null);
  const avg = {total: s.total / days.length, cost: s.cost / days.length};
  return `<div class="stats num">
    <div><span>${t.avg}</span><b>${tok(avg.total)}</b><i>${usd(avg.cost)}</i>${cur() ? `<i>${fx(avg.cost)}</i>` : ""}</div>
    <div><span>${t.peak}</span>${peak ? `<b>${tok(peak.total)}</b><i>${peak.label}(${wd(peak)})</i><i>${usd(peak.cost)}${cur() ? " · " + fxShort(peak.cost) : ""}</i>` : `<b>–</b>`}</div>
    <div><span>${t.used}</span><b>${s.used}<small>${t.ofDays(days.length)}</small></b><i>${t.out} ${tok(s.out)}</i><i>${t.cr} ${tok(s.cr)}</i></div>
  </div>`;
}
const rowName = r => r.rest ? T().others(r.count) : (r.label || r.name);
function hbars(rows, color) {
  if (!rows.length) return `<div class="msg">${T().none}</div>`;
  const max = Math.max(1, ...rows.filter(r => !r.rest).map(r => r.total));
  return `<div class="hbars num">${rows.map(r => `<span class="n${r.rest ? " rest" : ""}" title="${esc(rowName(r))}">${esc(rowName(r))}</span>
    <span class="b"><i class="${r.rest ? "rest" : ""}" style="width:${Math.min(100, r.total / max * 100).toFixed(1)}%${color && !r.rest ? ";background:" + color : ""}"></i></span>
    <span class="x" title="${usd(r.cost)}${cur() ? " · " + fx(r.cost) : ""}">${tok(r.total)}<small>${usd(r.cost)}</small>${cur() ? `<small>${fxShort(r.cost)}</small>` : ""}</span>`).join("")}</div>`;
}
/* 접을 수 있는 목록 머리: 접혀 있으면 오른쪽에 합계를 보여 준다 */
const CHEV = `<svg class="chev" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const isFolded = id => (conf.collapsed || []).includes(id);
function foldHead(id, title, rows, right) {
  const t = T(), closed = isFolded(id);
  const sum = rows.reduce((a, r) => ({total: a.total + r.total, cost: a.cost + r.cost}), {total: 0, cost: 0});
  const top = rows.find(r => !r.rest);
  const n = rows.reduce((a, r) => a + (r.rest ? r.count || 0 : 1), 0);
  const summary = top ? `${esc(rowName(top))}${n > 1 ? t.andMore(n - 1) : ""} · <b>${tok(sum.total)}</b> ${usd(sum.cost)} ${fxShort(sum.cost)}` : t.none;
  return `<div class="sec fold${closed ? " closed" : ""}" data-fold="${id}" role="button" tabindex="0" aria-expanded="${!closed}"
    title="${closed ? t.unfold : t.fold}">${CHEV}${title}${closed ? `<span class="sum num">${summary}</span>` : ""}${right}</div>`;
}
function toggleFold(id) {
  const c = new Set(conf.collapsed || []);
  c.has(id) ? c.delete(id) : c.add(id);
  conf.collapsed = [...c].sort();
  pywebview.api.set_conf("collapsed", conf.collapsed);
  renderLocal();
}
function emptyState() {   /* 기록이 하나도 없을 때 무엇을 하면 되는지 */
  const t = T(), [h, p] = !local.has_dir ? t.emptyNoDir : !local.files ? t.emptyNoFile : t.emptyOld;
  return `<div class="msg"><b>${h}</b>${p}</div>`;
}
function renderLocal() {
  if (!local) { $("#tok-body").innerHTML = `<div class="msg">${T().reading}</div>`; return; }
  const range = conf.proj_range === "period" ? "period" : "today";
  const p = I18N.ko.periods[conf.period] ? conf.period : "7";
  const key = JSON.stringify([local.error, local.today, local.days, local.models, local.projects, local.unpriced, local.files,
    range, p, lang(), cur(), cur() && rateOf(cur()), conf.collapsed]);
  if (key === lastTokKey) return;   /* 바뀐 게 없으면 다시 그리지 않음 */
  lastTokKey = key;
  const t = T();
  if (local.error) { $("#tok-body").innerHTML = `<div class="msg bad">${esc(t.scanErr(local.detail || local.error))}</div>`; return; }
  if (local.days.every(d => !d.total)) { $("#tok-body").innerHTML = emptyState(); return; }
  const td = local.today, days = periodDays(p), s = sumDays(days);
  const pname = p === "month" ? t.thisMonth(+td.date.slice(5, 7) - 1) : t.last(t.periods[p]);
  const projects = (range === "today" ? local.projects.today : local.projects[p]) || [];
  /* 토큰 아래에 API 환산(달러), 그 아래에 고른 통화 */
  const tile = (name, right, a) => `<div class="tile"><div class="k"><span>${name}</span><span class="num">${right}</span></div>
    <div class="v num">${tok(a.total)}<small>${t.tokens}</small></div>
    <div class="cost num">${usd(a.cost)}</div>${cur() ? `<div class="fx num">${fx(a.cost)}</div>` : ""}</div>`;
  let html = `<div class="tiles">${tile(t.today, t.out + " " + tok(td.out), td)}${tile(pname, t.est, s)}</div>
  <div class="meta num"><span>${t.todayIn} <b>${tok(td.in)}</b></span><span>${t.out} <b>${tok(td.out)}</b></span>
    <span>${t.cw} <b>${tok(td.cw)}</b></span><span>${t.cr} <b>${tok(td.cr)}</b></span></div>
  <div class="sec">${t.daily}<span class="r seg" id="period">${Object.entries(t.periods).map(([v, n]) =>
    `<button data-v="${v}" class="${p === v ? "on" : ""}">${n}</button>`).join("")}</span></div>
  ${dayChart(days)}${periodStats(days, s)}
  ${foldHead("models", t.models, local.models[p] || [], `<span class="r">${t.periods[p]}</span>`)}
  ${isFolded("models") ? "" : hbars(local.models[p] || [], "var(--clay)")}
  ${foldHead("projects", t.projects, projects, `<span class="r seg" id="seg">
    <button data-v="today" class="${range === "today" ? "on" : ""}">${t.today}</button><button data-v="period" class="${range === "period" ? "on" : ""}">${t.periods[p]}</button></span>`)}
  ${isFolded("projects") ? "" : hbars(projects)}`;
  if (local.unpriced?.length) html += `<div class="warnline">${t.unpriced}${local.unpriced.map(esc).join(", ")}</div>`;
  $("#tok-body").innerHTML = html;
  $("#seg").querySelectorAll("button").forEach(b => b.onclick = () => {
    conf.proj_range = b.dataset.v; pywebview.api.set_conf("proj_range", conf.proj_range); renderLocal();
  });
  $("#period").querySelectorAll("button").forEach(b => b.onclick = () => {
    conf.period = b.dataset.v; pywebview.api.set_conf("period", conf.period); renderLocal();
  });
}

/* ---------- 머리 · 시간 표시 ---------- */
function renderHead() {
  const t = T(), busy = !!inflight;
  const localOk = local && !local.error;
  const noPlan = planOff || conf.show_plan === false;
  $("#dot").className = "dot " + (busy ? "busy" : noPlan ? (localOk ? "ok" : "") :
    planErr ? (planErr.kind === "auth" ? "warn" : "bad") : plan ? "ok" : "");
  let s = busy ? t.busy : "";
  if (!busy && noPlan) {
    if (localOk) s = t.localAt(hhmm(local.scanned)) + (conf.show_plan === false ? "" : " · " + t.planOffHead);
  } else if (!busy) {
    const at = planErr?.fetched || plan?.fetched;
    if (planErr) s = `${t.failAt}${at ? " · " + hhmm(at) : ""}`;
    else if (plan) s = t.checked(hhmm(plan.fetched), ago(plan.fetched), Math.round(conf.interval / 60));
  }
  $("#sub").textContent = s;
  $("#tok-r").textContent = localOk ? t.files(local.files, hhmm(local.scanned)) : "";
}
function tickClock() {   /* 남은 시간 글자만 바꾼다 (초기화 시각이 지난 한도가 생겼을 때만 다시 그림) */
  if (staleSig() !== lastStaleSig) renderPlan();
  document.querySelectorAll("[data-reset]").forEach(e => { const v = left(+e.dataset.reset); if (e.textContent !== v) e.textContent = v; });
  renderHead();
  if (due()) refresh();
}

/* ---------- 고정 글자 · 설정 ---------- */
function applyLang() {
  const t = T();
  document.documentElement.lang = lang();
  $("#title").textContent = t.title;
  $("#refresh-t").textContent = t.refresh; $("#refresh").title = t.refreshTip;
  $("#pin").title = t.pin; $("#gear").title = t.settings;
  $("#plan-t").textContent = t.planTitle; $("#plan-off").textContent = t.planOff; $("#plan-off").title = t.planOffTip;
  $("#open-web").textContent = t.web; $("#open-web").title = t.webTip;
  $("#tok-t").textContent = t.tokTitle;
  $("#set-t").textContent = t.settings; $("#set-close").textContent = t.close;
  $("#l-lang").textContent = t.lang; $("#l-cur").textContent = t.cur; $("#l-rate").textContent = t.rate;
  $("#l-int").textContent = t.interval; $("#l-auto").textContent = t.autostart; $("#l-plan").textContent = t.showPlan;
  $("#set-note").textContent = t.note; $("#set-note").className = "note";
  $("#est").textContent = t.estFoot; $("#est").title = t.estTip; $("#fx-link").title = t.fxTip;
  applyTheme();
  fillSettings();
  lastPlanHTML = lastPlanErrHTML = lastTokKey = "";   /* 글자가 바뀌었으니 다시 그린다 */
  renderPlan(); renderLocal(); renderHead();
}
function fillSettings() {
  const t = T(), opt = (v, n, on) => `<option value="${v}"${on ? " selected" : ""}>${esc(n)}</option>`;
  $("#s-lang").innerHTML = opt("auto", t.langAuto, !["ko", "en"].includes(conf.lang)) + opt("ko", "한국어", conf.lang === "ko") + opt("en", "English", conf.lang === "en");
  const c = conf.currency || "auto";
  $("#s-cur").innerHTML = opt("auto", t.curAuto(conf.sys_currency || "USD"), c === "auto") + opt("USD", t.usdOnly, c === "USD") +
    Object.keys(conf.currencies || {}).map(k => opt(k, k, c === k)).join("");
  const iv = [60, 120, 300, 600, 900, 1800];
  if (!iv.includes(conf.interval)) iv.push(conf.interval);
  $("#interval").innerHTML = iv.sort((a, b) => a - b).map(v => opt(v, t.minutes(Math.round(v / 60)), v === conf.interval)).join("");
  $("#s-auto").checked = !!conf.autostart;
  $("#s-plan").checked = conf.show_plan !== false;
  showRate();
}
function showRate() {   /* 환율 칸과 아래쪽 '$1 = ₩1,500' 글자 */
  const c = cur(), inp = $("#s-rate");
  $("#l-rate").hidden = inp.parentElement.hidden = !c;
  $("#fx-link").hidden = !c;
  if (!c) return;
  if (document.activeElement !== inp) inp.value = rateOf(c).toLocaleString(LOCALE(), {maximumFractionDigits: 4});
  inp.classList.remove("bad");
  $("#s-rate-c").textContent = c;
  $("#fx-link").textContent = "$1 = " + new Intl.NumberFormat(LOCALE(), {style: "currency", currency: c, maximumFractionDigits: 4}).format(rateOf(c));
}
function rerender() { lastPlanHTML = ""; lastTokKey = ""; renderPlan(); renderLocal(); showRate(); }
function openSettings(focusRate) {
  $("#settings").hidden = false;
  if (focusRate && cur()) $("#s-rate").focus();
}
function bindSettings() {
  const note = (msg, bad) => { const n = $("#set-note"); n.textContent = msg || T().note; n.className = "note" + (bad ? " bad" : ""); };
  $("#gear").onclick = () => { $("#settings").hidden ? openSettings() : ($("#settings").hidden = true); $("#gear").classList.toggle("on", !$("#settings").hidden); };
  $("#set-close").onclick = () => { $("#settings").hidden = true; $("#gear").classList.remove("on"); };
  $("#fx-link").onclick = () => { openSettings(true); $("#gear").classList.add("on"); };
  $("#s-lang").onchange = e => { conf.lang = e.target.value; pywebview.api.set_conf("lang", conf.lang); applyLang(); };
  $("#s-cur").onchange = e => { conf.currency = e.target.value; pywebview.api.set_conf("currency", conf.currency); rerender(); };
  $("#interval").onchange = async e => { conf.interval = +e.target.value; await pywebview.api.set_conf("interval", conf.interval); renderHead(); };
  $("#s-auto").onchange = async e => {
    const on = e.target.checked, ok = await pywebview.api.set_conf("autostart", on);
    if (ok) conf.autostart = on; else { e.target.checked = !on; note(T().autoFail, true); }
  };
  $("#s-plan").onchange = e => {
    conf.show_plan = e.target.checked; pywebview.api.set_conf("show_plan", conf.show_plan);
    renderPlan(); renderHead(); if (conf.show_plan) refresh();
  };
  /* 환율: Enter나 다른 곳을 누르면 저장, Esc는 되돌리기. 잘못된 값이면 빨간 테두리 후 원래 값으로 */
  const inp = $("#s-rate");
  inp.onfocus = () => { inp.value = String(rateOf(cur())); inp.select(); };
  inp.onkeydown = e => { if (e.key === "Enter") inp.blur(); else if (e.key === "Escape") { inp.value = String(rateOf(cur())); inp.blur(); } };
  inp.onblur = async () => {
    const c = cur(); if (!c) return;
    const v = Number(inp.value.replace(/[,\s₩¥€£$원円]/g, ""));   /* 음수·글자는 NaN·음수로 남아 아래에서 걸러진다 */
    if (!(v > 0 && v <= 1e6)) { inp.classList.add("bad"); note(T().rateBad, true); setTimeout(() => { showRate(); note(); }, 1200); return; }
    if (v !== rateOf(c) && await pywebview.api.set_conf("fx_rate", {currency: c, rate: v})) {
      conf.fx = {...(conf.fx || {}), [c]: Math.round(v * 1e4) / 1e4};
      rerender();
    }
    note(); showRate();
  };
}

/* ---------- 가져오기 ---------- */
function refresh() {
  if (inflight) return inflight;   /* 가져오는 중에 또 누르면 같은 작업을 기다린다 */
  const btn = $("#refresh");
  btn.classList.add("spin"); btn.disabled = true;
  lastTry = Date.now() / 1000;
  inflight = (async () => {
    try {
      const hidden = conf.show_plan === false;   /* 카드를 숨겼으면 한도를 묻지 않는다 */
      const [s, p, l] = await Promise.all([pywebview.api.login_stamp(),
        hidden ? {kind: "disabled"} : pywebview.api.plan(), pywebview.api.local()]);
      loginStamp = s;
      if (p && p.ok) { plan = p; planErr = null; planOff = false; }
      else if (p && p.kind === "disabled") { plan = null; planErr = null; planOff = true; }
      else { planErr = p || {kind: "internal", code: "none"}; planOff = false; }
      if (l) local = l;
    } catch (e) {
      planErr = {kind: "internal", code: "widget", detail: String(e).slice(0, 120)};
    } finally {   /* 어떤 경우에도 버튼·표시를 원래대로 */
      inflight = null;
      retries = planErr || staleSig().includes("1") ? retries + 1 : 0;
      btn.classList.remove("spin"); btn.disabled = false;
      try { renderPlan(); renderLocal(); } catch (e) { }
      renderHead();
    }
  })();
  renderHead();
  return inflight;
}
async function tickLocal() {
  if (inflight) return;
  try {
    /* 만료·로그인 오류 중에 Claude Code가 토큰을 갱신하면(로그인 파일이 바뀌면) 새로고침 간격을 기다리지 않는다 */
    const s = await pywebview.api.login_stamp(), changed = loginStamp !== undefined && s !== loginStamp;
    loginStamp = s;
    if (changed && planErr?.kind === "auth") { refresh(); return; }
    const l = await pywebview.api.local(); if (l) { local = l; renderLocal(); }
  } catch (e) { }
  renderHead();
}
/* 자동 새로고침을 할 때인지. setInterval 하나에 맡기지 않고 실제 시각으로 따진다
   (절전에서 깨어나거나 창이 가려져 타이머가 늦어져도 바로 따라잡는다) */
function due() {
  if (inflight) return false;
  const now = Date.now() / 1000, since = now - lastTry, iv = Math.max(60, conf.interval || 300);
  if (since >= iv) return true;
  if (planOff || conf.show_plan === false) return false;
  /* 로그인 오류는 기다려도 같다 (로그인 파일이 바뀌면 tickLocal이 가져온다). 429는 간격대로만 */
  if (planErr && (planErr.kind === "auth" || planErr.code === "rate_limited")) return false;
  const reset = (plan?.limits || []).some(l => isStale(l) && now >= l.resets + 5);
  if (!reset && !planErr) return false;
  /* 초기화 직후 첫 확인은 바로(10초 간격만 두고), 그 뒤로 실패·예전 값이 이어지면 1분 · 2분 · 4분 … */
  return since >= (retries ? Math.min(iv, RETRY_MIN * 2 ** Math.min(retries - 1, 6)) : 10);
}
function applyTheme() {
  if (conf.theme === "light" || conf.theme === "dark") document.documentElement.dataset.theme = conf.theme;
  else delete document.documentElement.dataset.theme;
  $("#theme").title = T().theme + ": " + (T().themes[conf.theme] || T().themes.auto);
}

window.addEventListener("pywebviewready", async () => {
  conf = await pywebview.api.get_conf();
  $("#pin").classList.toggle("on", !!conf.topmost);
  bindSettings();
  applyLang();
  $("#refresh").onclick = () => refresh();
  $("#pin").onclick = () => { conf.topmost = !conf.topmost; $("#pin").classList.toggle("on", conf.topmost); pywebview.api.set_conf("topmost", conf.topmost); };
  $("#theme").onclick = () => { const k = Object.keys(I18N.ko.themes); conf.theme = k[(k.indexOf(conf.theme) + 1) % k.length]; applyTheme(); pywebview.api.set_conf("theme", conf.theme); };
  $("#open-web").onclick = () => pywebview.api.open_usage_page();
  $("#plan-off").onclick = () => setPlanEnabled(false);
  $("#plan-body").addEventListener("click", e => {
    if (e.target.closest("[data-act=plan-on]")) setPlanEnabled(true);
    else if (e.target.closest("[data-act=intro]")) { introOpen = !introOpen; renderPlan(); }
  });
  const fold = e => { const h = e.target.closest("[data-fold]"); if (h && !e.target.closest(".seg")) { e.preventDefault(); toggleFold(h.dataset.fold); } };
  $("#tok-body").addEventListener("click", fold);
  $("#tok-body").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") fold(e); });
  $("#ver").textContent = conf.version ? "v" + conf.version : "";
  $("#ver").title = lang() === "ko" ? "비공식 위젯 · Anthropic과 관계없음" : "Unofficial widget · not affiliated with Anthropic";
  refresh();
  setInterval(tickLocal, 30000);
  setInterval(tickClock, 15000);
  /* 최소화·다른 창에 가려졌다가 돌아오면 바로 확인 */
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tickClock(); });
});
</script>
</body>
</html>
